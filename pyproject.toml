[project]
name = "apm"
version = "0.1.0"
description = "Agentic Process Management MVP"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
# Tells nicegui.testing's `user` fixture (tests/test_ui_pages.py, via the
# root conftest.py) which file to load as the NiceGUI app under test.
main_file = "src/apm/ui/app.py"
